<div class="task-card" cdkDrag [cdkDragData]="task()" [class]="task()?.priority">
  <span class="task-title">{{ task()!.title }}</span>
  <div class="task-actions">
    <button type="button" class="btn-icon btn-primary" (click)="taskDetails.emit()">Ver</button>

    <div class="menu-wrapper">
      <button type="button" class="btn-dots" (click)="toggleMenu($event)" aria-label="Abrir menu">
        ⋮
      </button>
      @if (menuOpen()) {
        <div class="menu">
          <button class="menu-item" (click)="onEdit()">✏️ <span>Editar</span></button>

          <button class="menu-item danger" (click)="onDelete()">🗑️ <span>Excluir</span></button>
        </div>
      }
    </div>
  </div>

  <div cdkDragPlaceholder class="custom-placeholder"></div>
</div>
